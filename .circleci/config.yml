version: 2.1

jobs:
  playwright-tests:
    docker:
      # Official Playwright image with browsers installed
      - image: mcr.microsoft.com/playwright:v1.40.0-jammy
    working_directory: ~/repo
    steps:
      - checkout

      # Cache node_modules to speed up installs
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}
            - v1-deps-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: v1-deps-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

      - run:
          name: Run Playwright tests
          command: npx playwright test

      # Optional: store Playwright HTML report as an artifact
      - store_artifacts:
          path: playwright-report
          destination: playwright-report

workflows:
  version: 2
  nightly-playwright:
    triggers:
      - schedule:
          # Every day at 03:00 UTC
          cron: "0 3 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - playwright-tests